name: Download the tfgen binary
description: Downloads the tfgen binary to `bin/`.

runs:
  using: "composite"
  steps:

    - name: Download pulumi-tfgen-openrouter
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: pulumi-tfgen-openrouter
        path: ${{ github.workspace }}/bin

    - name: Ensure pulumi-tfgen-openrouter is executable
      shell: bash
      run: |
        find ${{ github.workspace }} -name "pulumi-*-openrouter" -print -exec chmod +x {} \;
