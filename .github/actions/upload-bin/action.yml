name: Upload bin assets
description: Uploads the provider and tfgen binaries to `bin/`.

runs:
  using: "composite"
  steps:
    - name: Tar provider binaries
      shell: bash
      run: tar -zcf ${{ github.workspace }}/bin/provider.tar.gz -C ${{ github.workspace }}/bin/ pulumi-resource-openrouter pulumi-tfgen-openrouter
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: openrouter-provider.tar.gz
        path: ${{ github.workspace }}/bin/provider.tar.gz
        retention-days: 30
