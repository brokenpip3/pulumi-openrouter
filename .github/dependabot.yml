version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "nix"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      nix:
        patterns: ["*"]
